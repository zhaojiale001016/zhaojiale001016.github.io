<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#22c1ee"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="60" cy="60" r="55" fill="url(#avatarGradient)" filter="url(#shadow)"/>
  
  <!-- 代码符号 </> -->
  <g fill="white" font-family="Monaco, Consolas, monospace" font-size="24" font-weight="bold">
    <text x="25" y="45" text-anchor="middle">&lt;</text>
    <text x="60" y="70" text-anchor="middle">/</text>
    <text x="95" y="45" text-anchor="middle">&gt;</text>
  </g>
  
  <!-- 装饰点 -->
  <g fill="white" fill-opacity="0.8">
    <circle cx="35" cy="75" r="2"/>
    <circle cx="85" cy="75" r="2"/>
    <circle cx="60" cy="85" r="1.5"/>
  </g>
</svg>