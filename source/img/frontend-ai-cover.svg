<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    
    <!-- 代码背景渐变 -->
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- AI光效 -->
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- 网格背景 -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- 左侧代码区域 -->
  <rect x="50" y="80" width="300" height="240" rx="8" fill="url(#codeGradient)" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  
  <!-- 代码文本 -->
  <text x="70" y="110" font-family="Monaco, Consolas, monospace" font-size="12" fill="#64748b">&lt;div className="ai-component"&gt;</text>
  <text x="90" y="130" font-family="Monaco, Consolas, monospace" font-size="12" fill="#06b6d4">const</text>
  <text x="130" y="130" font-family="Monaco, Consolas, monospace" font-size="12" fill="#e2e8f0">aiModel = </text>
  <text x="210" y="130" font-family="Monaco, Consolas, monospace" font-size="12" fill="#22c55e">useAI()</text>
  
  <text x="90" y="150" font-family="Monaco, Consolas, monospace" font-size="12" fill="#06b6d4">return</text>
  <text x="140" y="150" font-family="Monaco, Consolas, monospace" font-size="12" fill="#e2e8f0">(</text>
  
  <text x="110" y="170" font-family="Monaco, Consolas, monospace" font-size="12" fill="#64748b">&lt;SmartUI</text>
  <text x="190" y="190" font-family="Monaco, Consolas, monospace" font-size="12" fill="#f59e0b">model</text>
  <text x="230" y="190" font-family="Monaco, Consolas, monospace" font-size="12" fill="#e2e8f0">={aiModel}</text>
  <text x="190" y="210" font-family="Monaco, Consolas, monospace" font-size="12" fill="#f59e0b">adaptive</text>
  <text x="250" y="210" font-family="Monaco, Consolas, monospace" font-size="12" fill="#e2e8f0">={true}</text>
  <text x="110" y="230" font-family="Monaco, Consolas, monospace" font-size="12" fill="#64748b">/&gt;</text>
  
  <text x="90" y="250" font-family="Monaco, Consolas, monospace" font-size="12" fill="#e2e8f0">)</text>
  <text x="70" y="290" font-family="Monaco, Consolas, monospace" font-size="12" fill="#64748b">&lt;/div&gt;</text>
  
  <!-- 中央AI大脑图标 -->
  <g transform="translate(400, 200)">
    <!-- AI大脑外圈 -->
    <circle cx="0" cy="0" r="60" fill="url(#aiGlow)"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.8"/>
    
    <!-- 大脑形状 -->
    <path d="M-25,-20 Q-30,-35 -15,-40 Q0,-45 15,-40 Q30,-35 25,-20 Q30,-5 25,10 Q20,25 0,30 Q-20,25 -25,10 Q-30,-5 -25,-20 Z" 
          fill="#06b6d4" opacity="0.3" stroke="#06b6d4" stroke-width="1.5"/>
    
    <!-- 神经网络连接线 -->
    <g stroke="#3b82f6" stroke-width="1" opacity="0.6">
      <line x1="-15" y1="-10" x2="15" y2="10"/>
      <line x1="-10" y1="5" x2="10" y2="-5"/>
      <line x1="-20" y1="0" x2="20" y2="0"/>
      <line x1="0" y1="-15" x2="0" y2="15"/>
    </g>
    
    <!-- 神经节点 -->
    <circle cx="-15" cy="-10" r="3" fill="#3b82f6"/>
    <circle cx="15" cy="10" r="3" fill="#3b82f6"/>
    <circle cx="-10" cy="5" r="3" fill="#8b5cf6"/>
    <circle cx="10" cy="-5" r="3" fill="#8b5cf6"/>
    <circle cx="0" cy="0" r="4" fill="#06b6d4"/>
  </g>
  
  <!-- 右侧前端元素 -->
  <g transform="translate(550, 150)">
    <!-- React图标风格 -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#61dafb" stroke-width="2" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#61dafb" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#61dafb" stroke-width="1.5" opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#61dafb" stroke-width="1.5" opacity="0.6" transform="rotate(-60)"/>
    <circle cx="0" cy="0" r="5" fill="#61dafb"/>
  </g>
  
  <!-- 连接线动画效果 -->
  <g stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.7">
    <path d="M350,200 Q375,180 400,200">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;100,0;0,100" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M450,200 Q475,220 500,200">
      <animate attributeName="stroke-dasharray" values="100,0;50,50;0,100;100,0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 标题文字 -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#e2e8f0">前端与AI融合</text>
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">未来发展趋势与技术展望</text>
  
  <!-- 装饰性粒子 -->
  <g fill="#3b82f6" opacity="0.4">
    <circle cx="100" cy="50" r="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="80" r="1.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="350" r="2.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="320" r="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 边框装饰 -->
  <rect x="10" y="10" width="780" height="380" rx="12" fill="none" stroke="#475569" stroke-width="1" opacity="0.5"/>
</svg>