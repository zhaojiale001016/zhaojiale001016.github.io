<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#22c1ee"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <circle cx="350" cy="200" r="220" fill="#ffffff" fill-opacity="0.18" filter="url(#blur10)"/>
  <circle cx="1620" cy="280" r="200" fill="#ffffff" fill-opacity="0.12" filter="url(#blur10)"/>
  <circle cx="1100" cy="820" r="260" fill="#ffffff" fill-opacity="0.10" filter="url(#blur10)"/>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#glow)"/>
  <!-- decorative lines -->
  <g stroke="#fff" stroke-opacity="0.16" stroke-width="2">
    <path d="M-50,180 L1970,1080"/>
    <path d="M-50,0 L1500,1080"/>
    <path d="M200,0 L1800,1080"/>
  </g>
  <!-- subtle dots -->
  <g fill="#fff" fill-opacity="0.20">
    <circle cx="480" cy="380" r="2"/>
    <circle cx="640" cy="520" r="2"/>
    <circle cx="980" cy="260" r="2"/>
    <circle cx="1420" cy="600" r="2"/>
    <circle cx="1280" cy="420" r="2"/>
    <circle cx="1540" cy="860" r="2"/>
  </g>
</svg>