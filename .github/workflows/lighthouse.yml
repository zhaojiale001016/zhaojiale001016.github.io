name: Lighthouse CI
on:
  push:
    branches: [source]
  schedule:
    - cron: '0 3 * * 1'
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://zhaojiale001016.github.io/
            https://zhaojiale001016.github.io/posts/ai-coding-review-cost/
            https://zhaojiale001016.github.io/stats/
          uploadArtifacts: true
          temporaryPublicStorage: true
