<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="tagBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="tagGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="tagBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30"/>
    </filter>
    <pattern id="tagPattern" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="50" cy="50" r="1" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#tagBg)"/>
  <rect width="100%" height="100%" fill="url(#tagPattern)"/>
  
  <!-- 标签形状装饰 -->
  <g filter="url(#tagBlur)">
    <path d="M300,200 L450,200 L500,250 L450,300 L300,300 Z" fill="#ffffff" fill-opacity="0.18"/>
    <path d="M1400,350 L1550,350 L1600,400 L1550,450 L1400,450 Z" fill="#ffffff" fill-opacity="0.15"/>
    <path d="M800,650 L950,650 L1000,700 L950,750 L800,750 Z" fill="#ffffff" fill-opacity="0.12"/>
  </g>
  
  <rect x="0" y="0" width="100%" height="100%" fill="url(#tagGlow)"/>
  
  <!-- 连接线 -->
  <g stroke="#fff" stroke-opacity="0.15" stroke-width="2" fill="none">
    <path d="M100,400 Q500,300 900,450 Q1300,600 1700,400"/>
    <path d="M200,700 Q600,600 1000,750 Q1400,900 1800,700"/>
  </g>
  
  <!-- 小标签装饰 -->
  <g fill="#fff" fill-opacity="0.2">
    <rect x="600" y="300" width="40" height="20" rx="10"/>
    <rect x="1100" y="500" width="35" height="18" rx="9"/>
    <rect x="400" y="600" width="45" height="22" rx="11"/>
    <rect x="1300" y="200" width="38" height="19" rx="9.5"/>
  </g>
  
  <!-- 装饰圆点 -->
  <g fill="#fff" fill-opacity="0.2">
    <circle cx="350" cy="400" r="2.5"/>
    <circle cx="750" cy="250" r="2"/>
    <circle cx="1150" cy="600" r="3"/>
    <circle cx="1500" cy="750" r="2"/>
  </g>
</svg>