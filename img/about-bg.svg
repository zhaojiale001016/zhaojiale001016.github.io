<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 紫色系渐变 -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <!-- 径向渐变 -->
    <radialGradient id="purpleRadial" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- 滤镜效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- 网格图案 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f093fb" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#purpleGradient)"/>
  <rect width="100%" height="100%" fill="url(#purpleRadial)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- 装饰线条 -->
  <path d="M0,150 Q480,100 960,150 T1920,150" stroke="#f093fb" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M0,450 Q480,400 960,450 T1920,450" stroke="#667eea" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- 圆点装饰 -->
  <circle cx="200" cy="100" r="3" fill="#f093fb" opacity="0.8" filter="url(#glow)"/>
  <circle cx="800" cy="200" r="2" fill="#764ba2" opacity="0.6"/>
  <circle cx="1400" cy="150" r="4" fill="#667eea" opacity="0.7" filter="url(#glow)"/>
  <circle cx="1600" cy="350" r="2" fill="#f093fb" opacity="0.5"/>
  <circle cx="400" cy="500" r="3" fill="#764ba2" opacity="0.8"/>
  
  <!-- 关于页面特色：个人资料卡片形状 -->
  <rect x="1500" y="80" width="300" height="200" rx="15" ry="15" fill="none" stroke="#f093fb" stroke-width="2" opacity="0.4"/>
  <circle cx="1550" cy="130" r="20" fill="none" stroke="#667eea" stroke-width="2" opacity="0.5"/>
  <rect x="1580" y="120" width="80" height="8" rx="4" fill="#764ba2" opacity="0.3"/>
  <rect x="1580" y="140" width="120" height="6" rx="3" fill="#f093fb" opacity="0.3"/>
  <rect x="1580" y="155" width="100" height="6" rx="3" fill="#667eea" opacity="0.3"/>
  
  <!-- 几何装饰 -->
  <polygon points="100,400 150,350 200,400 150,450" fill="none" stroke="#f093fb" stroke-width="1.5" opacity="0.4"/>
  <polygon points="1200,500 1250,450 1300,500 1250,550" fill="#764ba2" opacity="0.2"/>
</svg>