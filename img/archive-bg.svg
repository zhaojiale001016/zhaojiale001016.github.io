<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="archiveBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="archiveGlow" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="archiveBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="35"/>
    </filter>
    <pattern id="archiveGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#archiveBg)"/>
  <rect width="100%" height="100%" fill="url(#archiveGrid)"/>
  
  <!-- 装饰性几何形状 -->
  <g filter="url(#archiveBlur)">
    <rect x="200" y="150" width="180" height="180" rx="20" fill="#ffffff" fill-opacity="0.15" transform="rotate(15 290 240)"/>
    <rect x="1500" y="300" width="200" height="200" rx="25" fill="#ffffff" fill-opacity="0.12" transform="rotate(-20 1600 400)"/>
    <rect x="800" y="700" width="220" height="220" rx="30" fill="#ffffff" fill-opacity="0.10" transform="rotate(25 910 810)"/>
  </g>
  
  <rect x="0" y="0" width="100%" height="100%" fill="url(#archiveGlow)"/>
  
  <!-- 装饰线条 -->
  <g stroke="#fff" stroke-opacity="0.12" stroke-width="1.5" fill="none">
    <path d="M0,300 Q480,200 960,350 T1920,250"/>
    <path d="M0,600 Q480,500 960,650 T1920,550"/>
    <path d="M0,900 Q480,800 960,950 T1920,850"/>
  </g>
  
  <!-- 装饰点 -->
  <g fill="#fff" fill-opacity="0.18">
    <circle cx="400" cy="250" r="3"/>
    <circle cx="720" cy="450" r="2"/>
    <circle cx="1200" cy="320" r="3"/>
    <circle cx="1600" cy="650" r="2"/>
    <circle cx="300" cy="750" r="2.5"/>
    <circle cx="1400" cy="800" r="2"/>
  </g>
</svg>